buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// safe-area-context 5.8.0 and WebView 13.16.1 still reference deprecated APIs with RN 0.85.3.
// Remove this suppression after dependency upgrades pass Kotlin compilation without those warnings.
gradle.projectsEvaluated {
    subprojects { subproject ->
        if (subproject.name != "app" && subproject.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    freeCompilerArgs.addAll(["-Xsuppress-warning=DEPRECATION", "-Xsuppress-warning=OVERRIDE_DEPRECATION"])
                }
            }
        }
    }
}
