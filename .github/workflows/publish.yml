name: Publish

# Manual release from pending changesets
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (test without publishing)'
        required: false
        type: boolean
        default: false

# Required permissions for version commits, tags, releases, and npm provenance
permissions:
  contents: write
  id-token: write

jobs:
  # Job 1: Validate input and create version commit
  create-version-commit:
    name: Create Version Commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check dry run mode
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 DRY RUN MODE ENABLED - No changes will be pushed to remote"
            echo "================================================"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Apply changesets
        id: version
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(node -p "require('./package/package.json').version")
          yarn version-packages
          VERSION=$(node -p "require('./package/package.json').version")
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "No pending changesets update react-native-nitro-cookies."
            exit 1
          fi
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            exit 1
          fi
          yarn install --immutable
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version commit
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git add package/package.json package/CHANGELOG.md .changeset
          git commit -m "chore(release): bump version to $VERSION"

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "✓ Version commit created: $COMMIT_SHA"

      - name: Upload versioned files (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: versioned-package
          path: |
            package/package.json
            package/CHANGELOG.md
          if-no-files-found: error

      - name: Push version commit
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 DRY RUN: Would push version commit to remote"
            echo "   Commit SHA: $(git rev-parse HEAD)"
            echo "   Branch: $(git branch --show-current)"
          else
            git push origin HEAD
            echo "✓ Version commit pushed to remote"
          fi

  # Job 2: Create and push version tag
  create-version-tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    needs: create-version-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.dry_run == 'true' && github.ref || needs.create-version-commit.outputs.commit_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        run: |
          VERSION="${{ needs.create-version-commit.outputs.version }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 DRY RUN: Would create and push tag v$VERSION"
            echo "   Current commit: $(git rev-parse HEAD)"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "✓ Tag v$VERSION created and pushed"
          fi

  # Job 3: Publish to NPM
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [create-version-commit, create-version-tag]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.dry_run == 'true' && github.ref || needs.create-version-commit.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore versioned files (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: versioned-package
          path: package

      - name: Build library
        run: |
          cd package
          yarn prepare

      - name: Verify build outputs
        run: |
          echo "Verifying build outputs..."
          cd package
          test -d lib/module || (echo "::error::lib/module directory not found" && exit 1)
          test -d lib/typescript || (echo "::error::lib/typescript directory not found" && exit 1)
          test -d nitrogen/generated || (echo "::error::nitrogen/generated directory not found" && exit 1)
          echo "✓ All build outputs verified"

      - name: Publish to NPM
        run: |
          cd package
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 DRY RUN: Testing NPM publish..."
            npm publish --dry-run --access public
            echo "✓ Dry run completed - package would be published to NPM registry"
          else
            echo "Publishing to NPM with provenance..."
            npm publish --provenance --access public
            echo "✓ Package published to NPM registry"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Job 4: Create GitHub Release with changelog
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [create-version-commit, publish-npm]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.dry_run == 'true' && github.ref || needs.create-version-commit.outputs.commit_sha }}

      - name: Restore versioned files (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: versioned-package
          path: package

      - name: Generate Release Notes
        id: release_notes
        env:
          VERSION: ${{ needs.create-version-commit.outputs.version }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="v$VERSION" 2>/dev/null || echo "")

          # Send debug output to stderr to avoid polluting release notes
          echo "Generating release notes for v$VERSION..." >&2
          echo "Previous tag: $PREVIOUS_TAG" >&2

          # Create release notes in a clean way
          {
            echo "## What's Changed"
            echo ""
            awk -v version="$VERSION" '
              $0 == "## " version { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' package/CHANGELOG.md
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "npm install react-native-nitro-cookies@$VERSION"
            echo "# or"
            echo "yarn add react-native-nitro-cookies@$VERSION"
            echo '```'
            echo ""
            echo "## Documentation"
            echo ""
            echo "- [README](https://github.com/l2hyunwoo/react-native-nitro-cookies#readme)"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog**: https://github.com/l2hyunwoo/react-native-nitro-cookies/compare/$PREVIOUS_TAG...v$VERSION"
            else
              echo "**Full Changelog**: https://github.com/l2hyunwoo/react-native-nitro-cookies/commits/v$VERSION"
            fi
          } > release_notes.md

      - name: Create Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-version-commit.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release_notes.md

      - name: Display Release Notes (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN: Would create GitHub release with the following notes:"
          echo "---"
          cat release_notes.md
          echo "---"
