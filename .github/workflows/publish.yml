name: Publish

# Pushes to main open or update the Version PR from pending changesets.
# A manual run publishes the version that is already committed on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (test without publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Create Version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create or update Version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          version-script: yarn version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: false
          push-git-tags: false

      - name: Verify versioned lockfile
        run: yarn install --immutable

  publish:
    name: Publish to NPM
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check dry run mode
        if: inputs.dry_run
        run: echo "🔍 DRY RUN MODE ENABLED - nothing will be published, tagged, or released"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package/package.json').version")
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Merge the Version PR before publishing."
            exit 1
          fi
          if [ -n "$(npm view "react-native-nitro-cookies@$VERSION" version 2>/dev/null || true)" ]; then
            echo "react-native-nitro-cookies@$VERSION is already on npm. Merge the Version PR before publishing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✓ Releasing v$VERSION"

      - name: Build library
        run: |
          cd package
          yarn prepare

      - name: Verify build outputs
        run: |
          echo "Verifying build outputs..."
          cd package
          test -d lib/module || (echo "::error::lib/module directory not found" && exit 1)
          test -d lib/typescript || (echo "::error::lib/typescript directory not found" && exit 1)
          test -d nitrogen/generated || (echo "::error::nitrogen/generated directory not found" && exit 1)
          echo "✓ All build outputs verified"

      - name: Generate Release Notes
        id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          {
            echo "## What's Changed"
            echo ""
            awk -v version="$VERSION" '
              $0 == "## " version { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' package/CHANGELOG.md
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "npm install react-native-nitro-cookies@$VERSION"
            echo "# or"
            echo "yarn add react-native-nitro-cookies@$VERSION"
            echo '```'
            echo ""
            echo "## Documentation"
            echo ""
            echo "- [README](https://github.com/l2hyunwoo/react-native-nitro-cookies#readme)"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog**: https://github.com/l2hyunwoo/react-native-nitro-cookies/compare/$PREVIOUS_TAG...v$VERSION"
            else
              echo "**Full Changelog**: https://github.com/l2hyunwoo/react-native-nitro-cookies/commits/v$VERSION"
            fi
          } > release_notes.md

      - name: Publish to NPM
        run: |
          cd package
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 DRY RUN: Testing NPM publish..."
            npm publish --dry-run --access public
          else
            echo "Publishing to NPM with provenance..."
            npm publish --provenance --access public
            echo "✓ Package published to NPM registry"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tag only after npm accepts the package so a failed publish can be retried.
      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 DRY RUN: Would create and push tag v$VERSION at $(git rev-parse HEAD)"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "✓ Tag v$VERSION created and pushed"
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 DRY RUN: Would create GitHub release v$VERSION with the following notes:"
            echo "---"
            cat release_notes.md
            echo "---"
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release_notes.md
          fi
