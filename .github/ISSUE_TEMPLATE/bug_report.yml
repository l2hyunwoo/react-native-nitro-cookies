name: 🐛 Bug report
description: Report a reproducible bug or regression in this library.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        # Bug report

        Include the versions and platform needed to reproduce the failure.
        Upstream React Native support and this library's tested configurations are different scopes.
        Peer dependency ranges do not mean every React Native version has been tested.
  - type: checkboxes
    attributes:
      label: Before submitting a new issue
      description: Please perform simple checks first.
      options:
        - label: I checked the library's release notes for an existing fix.
          required: true
        - label: I included the actual library, React Native, Nitro Modules, and OS versions below.
          required: true
        - label: I checked for possible duplicate issues, with possible answers.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: |
        Provide a clear and concise description of what the bug is.
        If needed, you can also provide other samples: error messages / stack traces, screenshots, gifs, etc.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: Include the npm version, or the source commit if testing a checkout.
      placeholder: "1.2.1 (npm), or source commit SHA"
    validations:
      required: true
  - type: textarea
    id: react-native-info
    attributes:
      label: Environment info
      description: |
        Paste `react-native info`, then add the Nitro Modules version and exact OS version.
        For Android, include the device or emulator image and WebView provider package/version, or state that none is available.
        For Apple, state whether the call uses the default cookie store or WebKit (`useWebKit: true`), and whether this is iOS or tvOS.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        You must provide a clear list of steps and code to reproduce the problem.
      value: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: reproducible-example
    attributes:
      label: Reproducible example repository 
      description: Please provide a link to a repository on GitHub with a reproducible example.
    validations:
      required: true
